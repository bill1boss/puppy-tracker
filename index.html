<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Εκπαίδευση Κουταβιού</title>

  <!-- Εικονίδιο για iPhone / iOS (Προσθήκη στην αρχική οθόνη) -->
  <link rel="apple-touch-icon" href="app-icon.jpg">

  <!-- Εικονίδιο για Android & Browsers -->
  <link rel="icon" type="image/jpeg" href="app-icon.jpg">
  <link rel="shortcut icon" href="app-icon.jpg" type="image/jpeg">

  <!-- Σύνδεση με το CSS σου -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="tracker-container">
    <h1>🐾 Εκπαίδευση Κουταβιού</h1>
    <p class="subtitle">Καταγράψτε τις εντολές και την πρόοδο</p>

    <!-- Φόρμα προσθήκης -->
    <form id="skill-form">
      <input type="text" id="skill-input" placeholder="Προσθέστε εντολή..." required autocomplete="off">
      <button type="submit" id="add-btn">Προσθήκη</button>
    </form>

    <!-- Λίστα -->
    <ul id="skills-list"></ul>
  </div>

  <!-- Σύνδεση με το JavaScript -->
  <script src="script.js"></script>
</body>
</html>
